<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Location Sharing</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f0f0f0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .box {
        background: white;
        padding: 30px;
        border-radius: 12px;
        width: 320px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        text-align: center;
    }

    button {
        background: #4CAF50;
        color: white;
        border: none;
        padding: 12px 20px;
        margin-top: 15px;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
    }

    button:hover {
        background: #45a049;
    }

    #result {
        margin-top: 15px;
        font-size: 14px;
        word-break: break-all;
    }
</style>
</head>

<body>

<div class="box">
    <h2>Share Your Location</h2>
    <p>Click the button below to share your current location.</p>

    <button onclick="getLocation()">Share Location</button>

    <div id="result"></div>
</div>

<script>
function getLocation() {
    const result = document.getElementById("result");

    if (!navigator.geolocation) {
        result.innerHTML = "Geolocation is not supported.";
        return;
    }

    navigator.geolocation.getCurrentPosition(
        (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const acc = pos.coords.accuracy;

            result.innerHTML = `
                <strong>Location received:</strong><br>
                Latitude: ${lat}<br>
                Longitude: ${lon}<br>
                Accuracy: ${acc} meters
            `;
        },
        (err) => {
            result.innerHTML = "Error: " + err.message;
        }
    );
}
</script>

</body>
</html>
